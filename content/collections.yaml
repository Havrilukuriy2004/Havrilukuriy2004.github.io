    - {n: 4, title: {uk: "Аналіз добробуту, публічні блага, екстерналії", en: "Welfare, public goods and externalities"}, slides: club/intro-economics/lecture_04.pdf}
    - {n: 5, title: {uk: "Модель фірми: виробництво, витрати, прибуток", en: "The firm: production, costs and profit"}, slides: club/intro-economics/lecture_05.pdf}
    - {n: 6, title: {uk: "Конкуренція та ринкові структури", en: "Competition and market structures"}, slides: club/intro-economics/lecture_06.pdf}
    - {n: 7, title: {uk: "Олігополія та основи теорії ігор", en: "Oligopoly and game theory basics"}, slides: club/intro-economics/lecture_07.pdf, practice: [{label: {uk: "Моделі олігополії (розширено)", en: "Oligopoly models (extended)"}, file: club/intro-economics/oligopoly_models_extended.pdf}]}
