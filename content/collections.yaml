        - {title: {uk: "Перевірка гіпотез: частки, середні, дисперсії, χ²-тести (слайди)", en: "Hypothesis testing: proportions, means, variances and χ² tests (slides)"}, file: teaching/kse/stats-1-1/hypothesis_testing_core_tests.pdf}
        - {title: {uk: "Двовибіркові t-тести: задачі з розв'язками", en: "Two-sample t tests: problems with solutions"}, file: teaching/kse/stats-1-1/two_sample_t_tests_practice.pdf}
        - {title: {uk: "Підготовка до фінального іспиту: тести і розподіли", en: "Final exam practice: tests and distributions"}, file: teaching/kse/stats-1-1/final_exam_practice_tests.pdf}
