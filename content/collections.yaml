- path: teaching/banking.html
  active: teaching.html
  parent: teaching.html
  parent_label: {uk: "Викладання", en: "Teaching"}
  title: {uk: "Банківська справа", en: "Banking"}
  subtitle: {uk: "Banking · ОНЕУ, весна 2026", en: "Банківська справа · ONEU, spring 2026"}
  description:
    uk: |
      Курс для студентів бакалаврату Одеського національного економічного університету: банківські ризики та їхнє
      вимірювання, система банківського регулювання і Базельські стандарти, фінансова стійкість банку, похідні
      інструменти в банках. Практика побудована на реальних даних НБУ: студенти пишуть коротку «записку про ризики»
      щодо закріпленого банку і перевіряють його стійкість до стандартизованого макрофінансового шоку.
    en: |
      An undergraduate course at Odesa National Economic University: banking risks and how to measure them, the system
      of banking regulation and the Basel standards, bank financial resilience and derivatives in banks. The practical
      part uses real NBU data: students write a short “risk note” on an assigned bank and test its resilience to a
      standardised macro-financial shock.
  groups:
    - title: {uk: "Лекції", en: "Lectures"}
      items:
        - {title: {uk: "Теми 9–11. Система регулювання банківської діяльності та фінансова стійкість банку (Базель, CAMELSO)", en: "Topics 9–11. Banking regulation and bank financial stability (Basel, CAMELSO)"}, file: teaching/banking/lecture_09_11_bank_risk_management.pdf}
        - {title: {uk: "Похідні фінансові інструменти в банках: презентація", en: "Derivatives used by banks: presentation (Ukrainian)"}, file: teaching/banking/lecture_derivatives_in_banks.pdf}
    - title: {uk: "Практика", en: "Practice"}
      items:
        - {title: {uk: "Problem Set 1. Прикладний аналіз банківських ризиків", en: "Problem Set 1. Applied banking risk analysis"}, file: teaching/banking/problem_set_1_topics_9_11.pdf}
        - {title: {uk: "Problem Set 1: дані", en: "Problem Set 1: data"}, file: teaching/banking/problem_set_1_topics_9_11_data.xlsx}
        - {title: {uk: "Problem Set 1: розв'язок", en: "Problem Set 1: solution"}, file: teaching/banking/problem_set_1_topics_9_11_solution.xlsx}
        - {title: {uk: "Problem Set 2. Система банківського регулювання", en: "Problem Set 2. The system of banking regulation"}, file: teaching/banking/problem_set_2.pdf}
        - {title: {uk: "Кейс: аналіз банківських ризиків, розв'язки T1–T9", en: "Case: banking risk analysis, solutions T1–T9"}, file: teaching/banking/case_bank_risk.pdf}
    - title: {uk: "Аналітичні додатки", en: "Analytical supplements"}
      items:
        - {title: {uk: "Макрофінансовий огляд банківської системи України, 2016–2026", en: "Macro-financial review of the Ukrainian banking system, 2016–2026"}, file: teaching/banking/macro_supplement.pdf}
        - {title: {uk: "Дані макрофінансового огляду", en: "Macro-financial review: data"}, file: teaching/banking/macro_supplement_data.xlsx}
        - {title: {uk: "Академічний звіт: ризики і результати банківської системи України", en: "Academic report: risk and performance of the Ukrainian banking system"}, file: teaching/banking/report_ukraine_banking_system.pdf}
        - {title: {uk: "Звіт: похідні фінансові інструменти, які використовують банки", en: "Report: derivatives used by banks (Ukrainian)"}, file: teaching/banking/report_derivatives_in_banks.pdf}

- path: teaching/kse-math-1-1.html
  active: teaching.html
  parent: teaching.html
  parent_label: {uk: "Викладання", en: "Teaching"}
  title: {uk: "Математика для економістів 1.1", en: "Mathematics for Economists 1.1"}
  subtitle: {uk: "Асистент викладача · KSE, MA in Economic Analysis, осінь 2026", en: "Teaching assistant · KSE, MA in Economic Analysis, autumn 2026"}
  description:
    uk: |
      Матеріали TA-сесій першого модуля математики магістерської програми Київської школи економіки. Функції та їхні
      графіки, похідні, екстремуми й опуклість, еластичність, виробничі функції та мінімізація середніх витрат,
      системи лінійних рівнянь і матрична форма. Кожна сесія містить короткий теоретичний блок і задачі з повними
      розв'язками. Матеріали англійською.
    en: |
      TA session materials for the first mathematics module of the MA in Economic Analysis at the Kyiv School of
      Economics. Functions and graphs, derivatives, extrema and concavity, elasticity, production functions and average
      cost minimisation, linear systems and matrix notation. Each session has a short theory block and exercises with
      full solutions.
  groups:
    - title: {uk: "TA-сесії", en: "TA sessions"}
      items:
        - {title: {uk: "Сесія 1. Функції, графіки, області визначення (слайди)", en: "Session 1. Functions, graphs and domains (slides)"}, file: teaching/kse/math-1-1/ta_session_1_functions_graphs.pdf}
        - {title: {uk: "Сесія 2. Критичні точки, екстремуми, опуклість, еластичність", en: "Session 2. Critical points, extrema, concavity and elasticity"}, file: teaching/kse/math-1-1/ta_session_2_extrema_concavity.pdf}
        - {title: {uk: "Сесія 3. Виробничі функції, витрати, похідні експоненти й логарифма, лінійні системи", en: "Session 3. Production functions, costs, exponential and log derivatives, linear systems"}, file: teaching/kse/math-1-1/ta_session_3_production_costs_derivatives.pdf}
        - {title: {uk: "Сесія 4. Системи лінійних рівнянь, метод Гаусса–Жордана, обернена матриця", en: "Session 4. Linear systems, Gauss–Jordan elimination and the matrix inverse"}, file: teaching/kse/math-1-1/ta_session_4_linear_systems_matrices.pdf}

- path: teaching/kse-math-1-2.html
  active: teaching.html
  parent: teaching.html
  parent_label: {uk: "Викладання", en: "Teaching"}
  title: {uk: "Математика для економістів 1.2", en: "Mathematics for Economists 1.2"}
  subtitle: {uk: "Асистент викладача · KSE, MA in Economic Analysis, осінь 2026", en: "Teaching assistant · KSE, MA in Economic Analysis, autumn 2026"}
  description:
    uk: |
      Семінари другого модуля математики KSE, побудовані за підручником Simon and Blume. Векторна алгебра й аналітична
      геометрія, границі послідовностей і відкриті та замкнені множини в ℝⁿ, функції багатьох змінних,
      частинні похідні й теорема про неявну функцію, квадратичні форми та їхня знаковизначеність за лінійних
      обмежень. Теорія, економічні приклади й задачі з розв'язками. Матеріали англійською.
    en: |
      Seminars for the second KSE mathematics module, following Simon and Blume. Vector algebra and analytic geometry,
      limits of sequences and open and closed sets in ℝⁿ, functions of several variables, partial derivatives
      and the implicit function theorem, quadratic forms and their definiteness under linear constraints. Theory,
      economic examples and exercises with solutions.
  groups:
    - title: {uk: "Семінари", en: "Seminars"}
      items:
        - {title: {uk: "Семінар 0. Векторна алгебра та аналітична геометрія", en: "Seminar 0. Vector algebra and analytic geometry"}, file: teaching/kse/math-1-2/seminar_0_vectors_analytic_geometry.pdf}
        - {title: {uk: "Семінар 1. Границі, послідовності, відкриті й замкнені множини", en: "Seminar 1. Limits, sequences, open and closed sets"}, file: teaching/kse/math-1-2/seminar_1_limits_open_closed_sets.pdf}
        - {title: {uk: "Семінар 2. Частинні похідні та неявні функції", en: "Seminar 2. Partial derivatives and implicit functions"}, file: teaching/kse/math-1-2/seminar_2_partial_derivatives_implicit_functions.pdf}
        - {title: {uk: "Семінар 3. Квадратичні форми та лінійні обмеження", en: "Seminar 3. Quadratic forms and linear constraints"}, file: teaching/kse/math-1-2/seminar_3_quadratic_forms_constraints.pdf}
        - {title: {uk: "Семінар 3, частина 2. Облямований гессіан: розв'язки задач із квадратичними формами за обмежень", en: "Seminar 3, part 2. Bordered Hessian: worked solutions for constrained quadratic forms"}, file: teaching/kse/math-1-2/seminar_3_part2_bordered_hessian_solutions.pdf}

- path: teaching/kse-stats-1-1.html
  active: teaching.html
  parent: teaching.html
  parent_label: {uk: "Викладання", en: "Teaching"}
  title: {uk: "Статистика та економетрика 1.1", en: "Statistics and Econometrics 1.1"}
  subtitle: {uk: "Асистент викладача · KSE, MA in Economic Analysis, осінь 2026", en: "Teaching assistant · KSE, MA in Economic Analysis, autumn 2026"}
  description:
    uk: |
      Матеріали до першого модуля статистики KSE. Вибірки та типи змінних, описова статистика, ймовірність і правило
      Байєса, біноміальний, пуассонівський, експоненційний і нормальний розподіли, перевірка гіпотез для частки,
      середніх і дисперсій, χ²-тести. Розв'язаний практичний Problem Set на R із вихідним Quarto-файлом,
      підготовка до мідтерму і фінального іспиту, статистичні таблиці. Матеріали англійською.
    en: |
      Materials for the first KSE statistics module. Sampling and types of variables, descriptive statistics,
      probability and Bayes' rule, the binomial, Poisson, exponential and normal distributions, hypothesis tests for
      proportions, means and variances, and χ² tests. A worked practice problem set in R with its Quarto source,
      midterm and final exam preparation, and statistical tables.
  groups:
    - title: {uk: "TA-сесії", en: "TA sessions"}
      items:
        - {title: {uk: "TA-сесія 1. Ймовірність, комбінаторика, умовна ймовірність, випадкові величини", en: "TA session 1. Probability, counting, conditional probability and random variables"}, file: teaching/kse/stats-1-1/ta_session_1_probability.pdf}
