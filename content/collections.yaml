- path: teaching/kse-stats-1-2.html
  active: teaching.html
  parent: teaching.html
  parent_label: {uk: "Викладання", en: "Teaching"}
  title: {uk: "Статистика та економетрика 1.2", en: "Statistics and Econometrics 1.2"}
  subtitle: {uk: "Асистент викладача · KSE, MA in Economic Analysis, осінь 2026", en: "Teaching assistant · KSE, MA in Economic Analysis, autumn 2026"}
  description:
    uk: |
      Матеріали до другого модуля, присвяченого лінійній регресії. Виведення оцінки МНК у матричній формі, припущення
      Гаусса–Маркова і властивість BLUE, гетероскедастичність і зсув через пропущені змінні, перевірка гіпотез про
      коефіцієнти множинної регресії. Збірник задач до мідтерму містить 25 задач, 20 концептуальних питань і 20
      тверджень «правда чи хибність» з повними розв'язками. Матеріали англійською.
    en: |
      Materials for the second module on linear regression. Deriving OLS in matrix form, the Gauss–Markov assumptions
      and the BLUE property, heteroskedasticity and omitted variable bias, and inference on multiple regression
      coefficients. The midterm problem book has 25 problems, 20 conceptual questions and 20 true/false statements,
      all with full solutions.
  groups:
    - title: {uk: "Матеріали", en: "Materials"}
      items:
        - {title: {uk: "TA-сесії 1–2. МНК, Гаусс–Марков і статистичні висновки в регресії (слайди)", en: "TA sessions 1–2. OLS, Gauss–Markov and regression inference (slides)"}, file: teaching/kse/stats-1-2/ta_sessions_1_2_ols_gauss_markov_inference.pdf}
        - {title: {uk: "Припущення Гаусса–Маркова, BLUE, гетероскедастичність і зсув: детальне виведення", en: "Gauss–Markov assumptions, BLUE, heteroskedasticity and bias: a detailed derivation"}, file: teaching/kse/stats-1-2/gauss_markov_blue_derivation.pdf}
        - {title: {uk: "Збірник задач до мідтерму: множинна регресія (з розв'язками)", en: "Midterm problem book: multiple regression (with solutions)"}, file: teaching/kse/stats-1-2/midterm_problem_book_multiple_regression.pdf}

- path: club/research-workshop.html
  active: club.html
  parent: club.html
  parent_label: {uk: "Макрофінансовий клуб", en: "Macro and Finance Club"}
  title: {uk: "Research workshop: як провести економетричне дослідження", en: "Research workshop: how to run an econometric study"}
  subtitle: {uk: "Макроекономічний та фінансовий клуб ОНЕУ спільно з ФЕУП, жовтень 2026", en: "ONEU Macroeconomics and Finance Club with FEUP, October 2026"}
  description:
    uk: |
      Практичний воркшоп, на якому чотири студентські команди проходять повний цикл емпіричного дослідження на
      власних темах: інфляція і реальні доходи, міграція, банківське кредитування, соціальні мережі та успішність.
      Кожен етап складається з короткого прикладу, командної роботи і розбору research design. За воркшоп команди
      формулюють питання і механізм, будують матрицю літератури та research gap, шукають і перевіряють дані,
      обирають функціональну форму, оцінюють базову модель з контрольними змінними, перевіряють загрози
      інтерпретації та стійкість результатів і захищають проєкт одним слайдом. Наскрізний навчальний приклад
      пов'язує дохід країни з тривалістю життя (Gapminder, 142 країни). Банківські дані в Excel-файлі симульовані
      для тренування методів.
    en: |
      A hands-on workshop in which four student teams take their own topics through a full empirical research cycle:
      inflation and real incomes, migration, bank lending, and social media and academic performance. Each stage has
      a short example, team work and a review of the research design. Over the workshop teams formulate a question and
      a mechanism, build a literature matrix and identify a research gap, find and audit data, choose a functional
      form, estimate a baseline model with controls, check threats to interpretation and robustness, and defend the
      project on one slide. The running example links country income to life expectancy (Gapminder, 142 countries).
      The bank data in the Excel file are simulated for practising the methods. Materials are in Ukrainian.
  groups:
    - title: {uk: "Матеріали воркшопу", en: "Workshop materials"}
      items:
        - {title: {uk: "Слайди воркшопу: від ідеї до готової роботи", en: "Workshop slides: from an idea to a finished paper (Ukrainian)"}, file: club/research-workshop/research_workshop_slides.pdf}
        - {title: {uk: "Додаток. Функціональні форми, банківське кредитування, регресія та ANOVA", en: "Appendix. Functional forms, bank lending, regression and ANOVA (Ukrainian)"}, file: club/research-workshop/appendix_functional_forms_regression_anova.pdf}
        - {title: {uk: "Дані та розрахунки: Gapminder, симульована банківська панель, регресії й ANOVA на формулах", en: "Data and calculations: Gapminder, a simulated bank panel, regressions and ANOVA in formulas"}, file: club/research-workshop/research_workshop_data.xlsx}
    - title: {uk: "Приклад дослідження", en: "Example study"}
      items:
        - {title: {uk: "Моделювання зв'язків між економічними показниками: валютний курс, інфляція, ВВП і облікова ставка (тест Грейнджера, VAR, ARIMA, QPM)", en: "Modelling links between economic indicators: exchange rate, inflation, GDP and the policy rate (Granger, VAR, ARIMA, QPM) (Ukrainian)"}, file: club/research-workshop/example_modelling_macro_indicators.pdf}

- path: club/intro-economics.html
  active: club.html
  parent: club.html
  parent_label: {uk: "Макрофінансовий клуб", en: "Macro and Finance Club"}
  title: {uk: "Вступ до економіки", en: "Introduction to Economics"}
  subtitle: {uk: "Introduction to Economics · ОНЕУ, осінь 2026", en: "Вступ до економіки · ONEU, autumn 2026"}
  description:
    uk: |
      Курс мікро- і макроекономіки, який я викладаю в ОНЕУ: від поведінки споживача і фірми до ВВП, грошей, монетарної та
      фіскальної політики і відкритої економіки. Лекції 9–13 містять слайди «Кейс» із новинами осені 2026 р. Оцінювання
      складається з п'яти Problem Sets і п'яти групових кейсів.
    en: |
      A micro- and macroeconomics course I teach at ONEU, from consumer and firm behaviour to GDP, money, monetary and
      fiscal policy and the open economy. Lectures 9–13 include “Case” slides built on autumn 2026 news. Assessment is
      based on five problem sets and five group cases. Lectures and assignments are in Ukrainian.
