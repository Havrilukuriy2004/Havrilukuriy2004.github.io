        - {title: {uk: "Practice Problem Set 1: вихідний Quarto-файл з кодом R", en: "Practice Problem Set 1: Quarto source with R code"}, file: teaching/kse/stats-1-1/practice_ps1_parts_a_b_c.qmd}
    - title: {uk: "Підготовка до мідтерму (лекції 1–5)", en: "Midterm preparation (lectures 1–5)"}
      items:
        - {title: {uk: "TA-сесія 3. Конспект і задачі з відповідями", en: "TA session 3. Review notes and problems with answers"}, file: teaching/kse/stats-1-1/midterm_preparation_handout.pdf}
        - {title: {uk: "Підготовка до мідтерму: слайди з задачами", en: "Midterm preparation: practice slides"}, file: teaching/kse/stats-1-1/midterm_preparation_slides.pdf}
