about:
  uk: |
    Магістрант Київської школи економіки (Economic Analysis) та Одеського національного економічного університету
    (Banking Management in Financial Markets). Провідний аналітик кредитних ризиків АТ «ВСТ БАНК», асистент-дослідник і асистент викладача KSE,
    голова Макроекономічного та фінансового клубу ОНЕУ.

    Досліджую, як працює банківське посередництво в умовах війни: скільки насправді коштує банкам ресурс, як швидко
    переоцінюються їхні баланси після змін облікової ставки і чому дешеві депозити не перетворюються на кредити.
    Окремі напрями досліджень охоплюють системний ризик, міжбанківські мережі та ESG-ризики банківських груп.

    В АТ «ВСТ БАНК» займаюся фінансовим аналізом підприємств і оцінкою інвестиційних проєктів: аналізую
    фінансову звітність і боргову місткість позичальників, будую моделі грошових потоків, розраховую NPV, IRR і
    строк окупності, оцінюю бізнес і чутливість проєктів до ставок, курсу та цін. Дані, код, Excel-інструменти й
    результати досліджень відкрито викладені на цьому сайті.
  en: |
    MA student at the Kyiv School of Economics (Economic Analysis) and Odesa National Economic University (Banking
    Management in Financial Markets). Lead credit risk analyst at VST BANK, research and teaching assistant at KSE and head of the
    ONEU Macroeconomics and Finance Club.

    I study how banking intermediation works in wartime: what funding really costs banks, how fast their balance sheets
    reprice after policy rate changes, and why cheap deposits do not turn into loans. Other strands of my work cover
    systemic risk, interbank networks and ESG risks of banking groups.

    At VST BANK JSC I analyse companies and investment projects: I review financial statements and the debt capacity
    of borrowers, build cash flow models, calculate NPV, IRR and payback, and assess business value and the
    sensitivity of projects to interest rates, the exchange rate and prices. The data, code, Excel tools and results of my research are published openly on
    this site.

