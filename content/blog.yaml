intro:
  uk: "Детальні записи про мої дослідження і ринок. Кожен запис пояснює питання, метод вимірювання, результати та їхнє значення для банків, інвесторів і регулятора. Дані, код і повні тексти доступні на сторінках проєктів."
  en: "In-depth posts on my research and on the market. Each post explains the question, the measurement, the results and what they mean for banks, investors and the regulator. Data, code and full texts are on the project pages."
