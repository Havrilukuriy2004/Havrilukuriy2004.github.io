about:
  uk: |
    Студентський клуб Одеського національного економічного університету при кафедрі банківської справи. Ми вивчаємо
    корпоративні фінанси, банківську справу, макроекономіку та фінансове моделювання на реальних даних і пишемо
    аналітичні записки у форматі research notes центральних банків.
  en: |
    A student club at Odesa National Economic University, hosted by the Department of Banking. We study corporate
    finance, banking, macroeconomics and financial modelling on real data, and write research notes in the format used
    by central banks.
activities:
  uk: ["Курси клубу: вступ до економіки, корпоративні фінанси з модулем банківського стажування, монетарна політика", "Відкриті лекції та обговорення наукових робіт", "Аналітичні записки та ONEU Monthly Economic Outlook", "Воркшопи з Excel, Python і R"]
  en: ["Club courses: introduction to economics, corporate finance with a banking internship module, monetary policy", "Open lectures and paper discussions", "Research notes and the ONEU Monthly Economic Outlook", "Excel, Python and R workshops"]
