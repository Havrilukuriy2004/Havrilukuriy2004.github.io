intro:
  uk: "Курси, які я викладаю в ОНЕУ та у Фінансовому клубі, і матеріали TA-сесій у Київській школі економіки: лекції, семінари, завдання з розв'язками, кейси, дані й Excel-моделі для вільного завантаження."
  en: "Courses I teach at ONEU and in the Finance Club, and my TA session materials at the Kyiv School of Economics: lectures, seminars, problems with solutions, cases, data and Excel models, free to download."
courses:
  - title: {uk: "Математика для економістів 1.1", en: "Mathematics for Economists 1.1"}
    where: {uk: "KSE, MA in Economic Analysis, осінь 2026 · асистент викладача", en: "KSE, MA in Economic Analysis, autumn 2026 · teaching assistant"}
    page: teaching/kse-math-1-1.html
    summary:
      uk: "Функції та графіки, екстремуми й опуклість, еластичність, виробничі функції й витрати, лінійні системи. Чотири TA-сесії з розв'язками."
      en: "Functions and graphs, extrema and concavity, elasticity, production and cost functions, linear systems. Four TA sessions with solutions."
  - title: {uk: "Математика для економістів 1.2", en: "Mathematics for Economists 1.2"}
    where: {uk: "KSE, MA in Economic Analysis, осінь 2026 · асистент викладача", en: "KSE, MA in Economic Analysis, autumn 2026 · teaching assistant"}
    page: teaching/kse-math-1-2.html
    summary:
      uk: "Вектори, границі й топологія ℝⁿ, частинні похідні й неявні функції, квадратичні форми з обмеженнями. Чотири семінари з розв'язками."
      en: "Vectors, limits and the topology of ℝⁿ, partial derivatives and implicit functions, constrained quadratic forms. Four seminars with solutions."
  - title: {uk: "Статистика та економетрика 1.1", en: "Statistics and Econometrics 1.1"}
    where: {uk: "KSE, MA in Economic Analysis, осінь 2026 · асистент викладача", en: "KSE, MA in Economic Analysis, autumn 2026 · teaching assistant"}
    page: teaching/kse-stats-1-1.html
    summary:
      uk: "Ймовірність, описова статистика, розподіли, перевірка гіпотез. TA-сесії, розв'язаний Problem Set на R, підготовка до мідтерму й іспиту, таблиці."
      en: "Probability, descriptive statistics, distributions, hypothesis testing. TA sessions, a worked problem set in R, midterm and exam preparation, tables."
  - title: {uk: "Статистика та економетрика 1.2", en: "Statistics and Econometrics 1.2"}
    where: {uk: "KSE, MA in Economic Analysis, осінь 2026 · асистент викладача", en: "KSE, MA in Economic Analysis, autumn 2026 · teaching assistant"}
    page: teaching/kse-stats-1-2.html
    summary:
      uk: "МНК у матричній формі, припущення Гаусса–Маркова, BLUE, статистичні висновки в регресії та збірник задач до мідтерму."
      en: "OLS in matrix form, the Gauss–Markov assumptions, BLUE, regression inference and a midterm problem book."
  - title: {uk: "Банківська справа", en: "Banking"}
    where: {uk: "ОНЕУ, бакалаврат, весна 2026", en: "ONEU, undergraduate, spring 2026"}
    page: teaching/banking.html
    summary:
      uk: "Банківські ризики та їх вимірювання, регулювання і Базельські стандарти, фінансова стійкість банку, похідні інструменти. Практика — записка про ризики конкретного банку на даних НБУ."
      en: "Banking risks and their measurement, regulation and Basel standards, bank resilience, derivatives. Practice: a risk note on a specific bank using NBU data."
  - title: {uk: "Вступ до економіки", en: "Introduction to Economics"}
    where: {uk: "ОНЕУ, осінь 2026 · окрема категорія у Фінансовому клубі", en: "ONEU, autumn 2026 · a separate category in the Finance Club"}
    page: club/intro-economics.html
    summary:
      uk: "Мікро- і макроекономіка: 11 лекцій, 5 Problem Sets, 5 групових кейсів і математичний буткемп."
      en: "Micro and macroeconomics: 11 lectures, 5 problem sets, 5 group cases and a maths bootcamp."
  - title: {uk: "Корпоративні фінанси та оцінка бізнесу: інтенсив", en: "Corporate Finance and Business Valuation: intensive"}
    where: {uk: "Фінансовий клуб ОНЕУ, березень–серпень 2026", en: "ONEU Finance Club, March–August 2026"}
    page: club/corporate-finance.html
    summary:
      uk: "Фінансова звітність, структура балансу, юніт-економіка й виручка на реальних даних українських компаній; Excel-моделі та фінальний проєкт."
      en: "Financial statements, balance sheet structure, unit economics and revenue on real Ukrainian company data; Excel models and a final project."
  - title: {uk: "Новокейнсіанська модель монетарної політики", en: "The New Keynesian Model of Monetary Policy"}
    where: {uk: "Фінансовий клуб ОНЕУ, 2026", en: "ONEU Finance Club, 2026"}
    page: club/monetary-policy.html
    summary:
      uk: "Від кривої Філліпса до DSGE/QPM і монетарної політики України у воєнний час, 169 слайдів."
      en: "From the Phillips curve to DSGE/QPM and Ukraine's wartime monetary policy, 169 slides."
