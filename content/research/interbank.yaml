findings:
  uk:
    - "**Архітектура мережі визначає ризик.** Мережі, реконструйовані за різними поведінковими гіпотезами (базова диверсифікація, перевага надійним, капіталізованим або подібним партнерам), суттєво відрізняються за вразливістю."
    - "**Еволюція мережі:** TERGM статистично підтверджує значущість транзитивності, взаємності й рівня капіталу, що валідує поведінкові сценарії реконструкції."
    - "**2014 р.:** у базовому сценарії модель клірингу Eisenberg–Noe дає потенційні втрати капіталу близько 1,5 млрд грн; пруденційні сценарії значно стійкіші."
    - "**2025 р.:** вища капіталізація робить систему стійкішою до прямого каскадного зараження, але абсолютний масштаб потенційних втрат від шоку ліквідності зріс до близько 62 млрд грн у базовому сценарії; за зв'язків із висококапіталізованими партнерами система стійка."
    - "**Модель PD:** Random Forest виявляє 27 із 30 дефолтів тестової вибірки (recall 90%, precision 6%) — фільтр першого рівня; найсильніші провісники — волатильність ліквідності й прибутковості, а агрегований PD за Грейнджером випереджає індекс фінансового стресу до 8 кварталів."
  en:
    - "**Network architecture determines risk.** Networks reconstructed under different behavioural hypotheses (baseline diversification, preference for safe, well-capitalised or similar partners) differ sharply in vulnerability."
    - "**Network evolution:** TERGM confirms the significance of transitivity, reciprocity and capital, validating the behavioural reconstruction scenarios."
    - "**2014:** in the baseline scenario the Eisenberg–Noe clearing model gives potential capital losses of about UAH 1.5 bn; prudential scenarios are much more resilient."
    - "**2025:** higher capitalisation makes the system more resilient to direct default cascades, but the absolute scale of potential losses from a liquidity shock has grown to about UAH 62 bn in the baseline; with links to well-capitalised partners the system is resilient."
    - "**PD model:** Random Forest flags 27 of 30 defaults in the test sample (90% recall, 6% precision), a first-level filter; the strongest predictors are the volatility of liquidity and profitability, and aggregate PD Granger-causes the financial stress index up to 8 quarters ahead."
