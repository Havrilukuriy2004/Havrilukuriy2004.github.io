abstract:
  uk: |
    Двосторонні міжбанківські експозиції є «чорною скринькою»: точні дані існують, але закриті банківською таємницею.
    Проєкт відтворює латентну топологію міжбанківських зобов'язань України лише з агрегованих балансових даних,
    перевіряє, які мережеві й поведінкові чинники керують її еволюцією, і порівнює стійкість системи до каскадних
    дефолтів у кризу «банкопаду» 2014 р. та в сучасних умовах. Окремий блок — система раннього попередження, що
    прогнозує ймовірність дефолту банку на річному горизонті й задає стартові умови для стрес-сценаріїв.
  en: |
    Bilateral interbank exposures are a “black box”: the exact data exist but are protected by banking secrecy. The
    project reconstructs the latent topology of Ukrainian interbank liabilities from aggregate balance sheet data,
    tests which network and behavioural factors drive its evolution, and compares the system's resilience to default
    cascades during the 2014 banking crisis and today. A separate module is an early-warning system that predicts a
    bank's one-year probability of default and sets the starting conditions for the stress scenarios.
