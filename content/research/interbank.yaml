card:
  uk: "Реконструкція неспостережуваної мережі міжбанківських експозицій, моделі її еволюції (TERGM, SIENA) і каскадні дефолти за Furfine та Eisenberg–Noe: криза 2014 р. проти 2025 р.; модель раннього попередження PD."
  en: "Reconstructing the unobserved network of interbank exposures, models of its evolution (TERGM, SIENA) and default cascades à la Furfine and Eisenberg–Noe: the 2014 crisis vs 2025; an early-warning PD model."
