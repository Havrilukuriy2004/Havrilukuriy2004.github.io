findings:
  uk:
    - "**Дешевизна депозитів структурна, а не цінова.** Частка коштів на вимогу зросла з 50,3% до 73,6%, валютна частка депозитів знизилася з 45,4% до 29,4%. Структурні злами у 2020 р., 2022 р. та березні 2025 р. не дозволяють використовувати єдиний коефіцієнт передачі."
    - "**Передача облікової ставки неповна й асиметрична.** Дохідність сертифікатів НБУ реагує майже повністю за місяць, вартість депозитів і дохідність активів — лише на близько 0,42 в. п. за 12 міс.; банки швидше знижують завищені ставки, ніж підвищують занижені (−0,162 проти −0,085). Запровадження тримісячних ДС підняло ставки строкових депозитів населення на 0,37–0,45 в. п."
    - "**Договірний і виявлений розриви мають протилежні знаки:** −13,62% проти +15,40% активів у серпні 2026 р.; додатний виявлений розрив мають 97% банків. Головна загроза для маржі — швидке зниження ставок: 1-й процентиль зміни річного чистого процентного доходу системи становить −16,8%."
    - "**Прихована вартість фондування:** за номінальної вартості депозитів 5,00% економічна становить 6,76%; надбавка 1,76 в. п. на 71% формується грошовим резервом на кореспондентському рахунку."
    - "**Ціна не керує структурою активів.** +1 в. п. відносної дохідності кредитів збільшує їхню частку лише на 0,16 в. п.; запас капіталу, більший на 10 в. п., передує зростанню частки кредитів на 3,0 в. п. за рік. Із кожної додаткової гривні депозитів з березня 2022 р. банки спрямовували в кредити 5 коп., в ОВДП 12 коп., у сертифікати НБУ 50 коп."
    - "**Ієрархія обмежень:** режимне (війна і монетарний режим) задає рівень кредитування, капітальне визначає, хто нарощує кредити, ціновий чинник діє третім. Із 16,6 в. п. падіння частки кредитів у 2022–2023 рр. відносна дохідність пояснює 0,8 в. п."
  en:
    - "**Deposit cheapness is structural, not a matter of price.** The share of demand deposits rose from 50.3% to 73.6% and the FX share of deposits fell from 45.4% to 29.4%. Structural breaks in 2020, 2022 and March 2025 rule out a single pass-through coefficient."
    - "**Policy rate pass-through is incomplete and asymmetric.** NBU CD yields respond almost fully within a month; the cost of deposits and asset yields move by about 0.42 pp over 12 months. Banks cut rates that are too high faster than they raise rates that are too low (−0.162 vs −0.085). Three-month CDs raised household term deposit rates by 0.37–0.45 pp."
    - "**The contractual and revealed gaps have opposite signs:** −13.62% vs +15.40% of assets in August 2026; 97% of banks have a positive revealed gap. The main risk to margins is rapid easing: the 1st percentile of the change in annual system NII is −16.8%."
    - "**Hidden cost of funding:** with a reported deposit cost of 5.00%, the economic cost is 6.76%; 71% of the 1.76 pp wedge comes from cash reserves in correspondent accounts."
    - "**Prices do not steer the asset mix.** +1 pp of relative loan return raises the loan share by only 0.16 pp; 10 pp more capital headroom precedes a 3.0 pp rise in the loan share within a year. Of every additional hryvnia of deposits since March 2022, banks put 5 kopiykas into loans, 12 into OVDP and 50 into NBU CDs."
    - "**A hierarchy of constraints:** the regime constraint (war and monetary regime) sets the level of lending, capital determines which banks expand, and price comes third. Of the 16.6 pp fall in the loan share in 2022–2023, relative returns explain 0.8 pp."
