abstract:
  uk: |
    Робота розглядає фондування, процентне переоцінювання і вибір активів як **єдину задачу управління банківським балансом**.
    Розмежовано договірну, бухгалтерську, граничну, тіньову і трансфертну вартість ресурсу, формалізовано договірний і
    *виявлений* розриви переоцінювання, чутливість чистого процентного доходу та економічної вартості капіталу, а також
    граничну умову вибору між кредитами, ОВДП і депозитними сертифікатами НБУ.

    Емпірична частина спирається на відкриті дані НБУ за січень 2018 – серпень 2026 р. Показано, що номінальна дешевизна
    депозитів — наслідок переважання коштів на вимогу; що 12-місячна передача облікової ставки у вартість депозитів
    неповна (близько 0,42); що виявлений розрив переоцінювання системи додатний (+15,4% активів проти −13,6% за договірним
    підходом); що економічна вартість депозитів перевищує номінальну на 1,76 в. п. Еластичність структури активів за
    відносною дохідністю мала, а кредитну експансію визначає **запас капіталу**, причому цей зв'язок відображає пропозицію
    кредиту, а не попит на нього.
  en: |
    The thesis treats funding, interest rate repricing and asset choice as **a single bank balance sheet management problem**.
    It distinguishes the contractual, book, marginal, shadow and transfer cost of funds; formalises the contractual and
    *revealed* repricing gaps, the sensitivity of net interest income and of the economic value of equity; and derives the
    marginal condition for choosing between loans, government bonds (OVDP) and NBU certificates of deposit.

    The empirical part uses open NBU data for January 2018 – August 2026. The nominal cheapness of deposits results from
    the dominance of demand deposits; 12-month pass-through of the policy rate to the cost of deposits is incomplete
    (about 0.42); the revealed repricing gap of the system is positive (+15.4% of assets against −13.6% under the contractual
    approach); and the economic cost of deposits exceeds the reported cost by 1.76 pp. The elasticity of the asset
    structure with respect to relative returns is small, while credit expansion is driven by **capital headroom**, a link
    that reflects credit supply rather than demand.
