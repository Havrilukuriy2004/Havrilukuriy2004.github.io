findings:
  uk:
    - "**Концентрація–крихкість:** вища концентрація (HHI, CR3) за Грейнджером передує зростанню частки NPL і резервів під кредитні збитки з лагом 6–12 місяців."
    - "**Конкуренція–стабільність:** посилення конкуренції (ентропія Шеннона, H-статистика) знижує кредитний ризик; водночас вища капіталізація системи веде до її деконцентрації, а періоди нестабільності пригнічують конкуренцію."
    - "**Український FCI** з коефіцієнтом обслуговування боргу, опитуваннями банків і ринком нерухомості краще прогнозує фази накопичення ризику, ніж стандартні аналоги на кшталт d-SRI."
    - "**Асиметрія наслідків:** найменш прибуткові банки (5-й і 10-й квантилі) втрачають у 7–8 разів більше рентабельності, ніж медіанний банк, що свідчить про моральний ризик і ризик-шифтинг."
    - "**Координація політик:** у грі монетарного і макропруденційного регуляторів рівновага Неша показує, що жорстка монетарна політика має поєднуватися з відповідними пруденційними заходами."
    - "**Парадокс диверсифікації:** за високої зовнішньої невизначеності посилення взаємозв'язків між банками без зміцнення їхніх капітальних буферів збільшує, а не зменшує системний ризик."
  en:
    - "**Concentration–fragility:** higher concentration (HHI, CR3) Granger-causes higher NPL shares and loan loss reserves with a 6–12 month lag."
    - "**Competition–stability:** more competition (Shannon entropy, H-statistic) lowers credit risk; at the same time, higher system capitalisation leads to deconcentration and instability suppresses competition."
    - "**A Ukrainian FCI** with the debt service ratio, bank lending surveys and the property market predicts risk build-up phases better than standard indicators such as the d-SRI."
    - "**Asymmetric losses:** the least profitable banks (5th and 10th quantiles) lose 7–8 times more profitability than the median bank, consistent with moral hazard and risk shifting."
    - "**Policy coordination:** in a game between monetary and macroprudential authorities, the Nash equilibrium shows that tight monetary policy must be matched by tight prudential measures."
    - "**Diversification paradox:** under high external uncertainty, more interconnectedness without stronger capital buffers raises rather than lowers systemic risk."
