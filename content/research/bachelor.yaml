card:
  uk: "Структурний і циклічний системний ризик в Україні: концентрація і крихкість, індикатор фінансового циклу, квантильні локальні проєкції, теорія ігор регуляторів і «парадокс диверсифікації»."
  en: "Structural and cyclical systemic risk in Ukraine: concentration and fragility, a financial cycle indicator, quantile local projections, a game between regulators and the “diversification paradox”."
