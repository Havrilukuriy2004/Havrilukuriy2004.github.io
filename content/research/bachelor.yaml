abstract:
  uk: |
    Робота розглядає системний ризик як поєднання **структурної** складової (концентрація, взаємозв'язки, системно
    важливі банки) і **циклічної** (проциклічна поведінка, накопичення вразливостей у фазі підйому). На даних НБУ
    перевірено гіпотези «концентрація–крихкість» і «конкуренція–стабільність», побудовано індикатор фінансового циклу
    (FCI), адаптований до України, і оцінено його асиметричний вплив на прибутковість банків квантильними локальними
    проєкціями. Третій розділ досліджує конфлікт монетарної та макропруденційної політик засобами теорії ігор і
    обґрунтовує «парадокс диверсифікації» в моделі середнього поля; на цій основі запропоновано підхід до калібрування
    контрциклічного буфера капіталу.
  en: |
    The thesis treats systemic risk as a combination of a **structural** component (concentration, interconnectedness,
    systemically important banks) and a **cyclical** one (procyclical behaviour, vulnerabilities built up in booms).
    Using NBU data it tests the concentration–fragility and competition–stability hypotheses, builds a financial cycle
    indicator (FCI) adapted to Ukraine and estimates its asymmetric effect on bank profitability with quantile local
    projections. The third chapter studies the conflict between monetary and macroprudential policy with game theory
    and derives a “diversification paradox” in a mean-field model, leading to an approach for calibrating the
    countercyclical capital buffer.
