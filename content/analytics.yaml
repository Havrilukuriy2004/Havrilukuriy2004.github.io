intro:
  uk: |
    Робочі інструменти, що виросли з моїх досліджень. Два інтерактивні застосунки: банківський, про інвестиційну
    діяльність банків, і ринковий, про індекс українських публічних компаній ULCI. Також тут ключові індикатори
    банківської системи, Excel-моделі для аналізу банку чи компанії та відкриті набори даних.
  en: |
    Working tools that grew out of my research. Two interactive apps, one on the investment activity of banks and one on
    ULCI, an index of Ukrainian listed companies, plus key banking system indicators, Excel models for analysing a bank
    or a company, and open datasets.
dashboards:
  - id: banks
    page: analytics/banks.html
    url: "https://bank-dashboard-oneu.streamlit.app/"
    tag: {uk: "Банки", en: "Banks"}
    title: {uk: "Інвестиційна діяльність банків України", en: "Investment activity of Ukrainian banks"}
    desc:
      uk: "Структура інвестиційного портфеля, дохідність інвестицій і фінансовий результат від інвестиційної діяльності за окремими банками, групами і системою. Дані NBU OpenData."
      en: "Structure of the investment portfolio, investment yield and the result from investment activity for individual banks, groups and the system. NBU OpenData."
    code: analytics/nbu_streamlit_investment_dashboard_ua.zip
  - id: ulci
    page: analytics/ulci.html
    url: "https://ulci-data.streamlit.app/"
    tag: {uk: "Ринок акцій", en: "Equities"}
    title: {uk: "ULCI: індекс українських публічних компаній", en: "ULCI: Ukraine Listed Companies Index"}
    desc:
      uk: "Українські компанії з лістингом у Варшаві, Лондоні, Торонто, Франкфурті, Парижі та на Nasdaq. Індекс, капіталізація, ліквідність, сектори і кількість акцій у free float."
      en: "Ukrainian companies listed in Warsaw, London, Toronto, Frankfurt, Paris and on Nasdaq. The index, market capitalisation, liquidity, sectors and free-float share counts."
    post: ulci-october-2026
