      - {title: {uk: "Панель банків, 2018–2026", en: "Bank panel, 2018–2026"}, file: master/data/banks_panel.csv}
      - {title: {uk: "Словник змінних", en: "Variable dictionary (Ukrainian)"}, file: master/data/data_dictionary_uk.csv}
      - {title: {uk: "Вітрини даних НБУ (Parquet)", en: "NBU data marts (Parquet)"}, file: master/database/nbu_thesis_marts_v6_parquet.zip}
